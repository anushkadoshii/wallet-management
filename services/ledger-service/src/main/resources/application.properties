spring.application.name=ledger-service
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/ledger_db
spring.datasource.username=${DB_USER:user}
spring.datasource.password=${DB_PASSWORD:password123}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.data.web.pageable.max-page-size=100

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# conditional | pessimistic | optimistic | serializable (Day 17)
kosh.ledger.overdraft-strategy=conditional